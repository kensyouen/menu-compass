<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="献立コンパス">
  <title>献立コンパス</title>
  <script>
    (function(){
      const c = document.createElement('canvas'); c.width=180; c.height=180; const x = c.getContext('2d');
      const g = x.createLinearGradient(0,0,180,180); g.addColorStop(0,'#ffaf38'); g.addColorStop(1,'#ff9500');
      x.fillStyle=g; x.fillRect(0,0,180,180);
      x.fillStyle='#fff'; x.beginPath(); x.arc(90,90,45,0,7); x.arc(65,80,35,0,7); x.arc(115,95,35,0,7); x.arc(95,60,30,0,7); x.arc(80,120,30,0,7); x.fill();
      x.fillStyle='#ffcc00'; x.beginPath(); x.arc(85,95,22,0,7); x.fill();
      x.fillStyle='#fff'; x.globalAlpha=0.7; x.beginPath(); x.arc(78,88,5,0,7); x.fill();
      const l = document.createElement('link'); l.rel='apple-touch-icon'; l.href=c.toDataURL('image/png'); document.head.appendChild(l);
    })();
  </script>
  <style>
    :root{--bg:#f2f2f7;--card:#fff;--p:#007aff;--t:#000;--s:#8e8e93;--b:#c6c6c8;--d:#ff3b30;--st:env(safe-area-inset-top,44px);--sb:env(safe-area-inset-bottom,34px)}
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
    body{background:var(--bg);font-family:-apple-system,sans-serif;color:var(--t);overflow-x:hidden;padding-top:var(--st);padding-bottom:calc(83px + var(--sb))}
    header{padding:16px 20px 8px} h1{font-size:34px;font-weight:700;letter-spacing:-.5px}
    .card{background:var(--card);border-radius:12px;padding:16px;margin:0 16px 16px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
    .card-title{font-size:17px;font-weight:600;margin-bottom:12px}
    button{border:none;border-radius:10px;font-size:17px;font-weight:600;padding:12px;width:100%;cursor:pointer} button:active{opacity:.7}
    .btn-primary{background:var(--p);color:#fff} .btn-secondary{background:#e5e5ea;color:var(--p)} .btn-danger{background:#ffebee;color:var(--d)}
    input,select{width:100%;padding:12px;font-size:17px;border:1px solid #e5e5ea;border-radius:10px;margin-bottom:12px;background:#fafafa}
    .list-item{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:.5px solid #e5e5ea} .list-item:last-child{border-bottom:none} .strikethrough{text-decoration:line-through;color:var(--s)}
    .tab-bar{position:fixed;bottom:0;width:100%;height:calc(55px + var(--sb));background:rgba(255,255,255,.85);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:.5px solid var(--b);display:flex;justify-content:space-around;align-items:center;padding-bottom:var(--sb);z-index:1000}
    .tab-item{display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--s);font-size:10px;font-weight:500;width:33%;height:50px} .tab-item.active{color:var(--p)} .tab-icon{font-size:24px;margin-bottom:2px}
    .view{display:none;animation:fadeIn .3s} .view.active{display:block} @keyframes fadeIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
    .chip-container{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px} .chip{background:#e5e5ea;color:var(--p);padding:6px 12px;border-radius:16px;font-size:14px;font-weight:500;display:inline-flex;align-items:center;gap:4px}
    #loading{position:fixed;top:0;left:0;width:100%;height:100%;background:var(--bg);z-index:9999;display:flex;flex-direction:column;justify-content:center;align-items:center;font-size:17px;font-weight:600;color:var(--s);padding:20px;text-align:center}
  </style>
</head>
<body>

  <div id="loading">
    <div id="loadingIcon" style="font-size:40px;margin-bottom:16px;">🍳</div>
    <div id="loadingText">データを同期中...<br><span style="font-size:12px;color:#aaa;">(最大10秒)</span></div>
    <div id="errorArea" style="margin-top:20px;width:100%;"></div>
  </div>

  <div id="app" style="display:none;">
    <!-- 🏠 ホーム -->
    <div id="view-home" class="view active">
      <header><h1>ホーム</h1></header>
      <div class="card">
        <div class="card-title">何日分の献立を作りますか？</div>
        <div style="display:flex;align-items:center;gap:16px;margin-bottom:16px;">
          <input type="range" id="planDays" min="1" max="7" value="3" style="flex:1;margin:0;" oninput="document.getElementById('daysLabel').innerText=this.value+'日分'">
          <span id="daysLabel" style="font-weight:600;width:50px;text-align:right;">3日分</span>
        </div>
        <button class="btn-primary" onclick="generateMenu()">✨ 献立を自動生成</button>
      </div>
      <div id="menuContainer"></div>
      <div class="card" id="copyCard" style="display:none;">
        <button class="btn-secondary" onclick="copyToClipboard()">📱 LINE用にコピー</button>
      </div>
    </div>

    <!-- ❄️ 冷蔵庫 -->
    <div id="view-inventory" class="view">
      <header><h1>冷蔵庫</h1></header>
      <div class="card"><div class="card-title">現在の在庫</div><div id="inventoryList"></div></div>
      <div class="card">
        <div class="card-title">✍️ 手動で追加</div>
        <div style="display:flex;gap:8px;"><input type="text" id="invInput" placeholder="食材名" style="margin:0;"><button class="btn-primary" style="width:80px;" onclick="addInventoryManual()">追加</button></div>
      </div>
      <div class="card"><div class="card-title">💡 レシピ食材から追加</div><div id="chipContainer" class="chip-container"></div></div>
      <div class="card">
        <div class="card-title">📷 写真をAIで読み取る</div>
        <input type="file" id="imageInput" accept="image/*" onchange="previewImage(event)">
        <img id="imagePreview" style="width:100%;border-radius:8px;margin-bottom:12px;display:none;">
        <button class="btn-primary" id="aiBtn" style="display:none;" onclick="analyzeImage()">✨ AIで解析する</button>
        <div id="aiStatus" style="margin-top:8px;font-size:14px;color:var(--text-sub);"></div>
      </div>
    </div>

    <!-- 🍳 レシピ -->
    <div id="view-recipe" class="view">
      <header><h1>レシピ管理</h1></header>
      <div class="card" id="recipeFormCard" style="border:2px solid transparent;transition:border .3s;">
        <div class="card-title" id="recipeFormTitle">📝 新規レシピ登録</div>
        <input type="text" id="rName" placeholder="料理名">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;">
          <span style="font-weight:600;">難易度: <span id="diffLabel">3</span></span>
          <input type="range" id="rDiff" min="1" max="5" value="3" style="width:60%;margin:0;" oninput="document.getElementById('diffLabel').innerText=this.value">
        </div>
        <input type="text" id="rIngs" placeholder="必要な食材 (カンマ区切り)">
        <select id="rSeason" multiple style="height:120px;">
          <option value="通年" selected>通年</option>
          <option value="春">春 (3-5月)</option>
          <option value="夏">夏 (6-8月)</option>
          <option value="秋">秋 (9-11月)</option>
          <option value="冬">冬 (12-2月)</option>
        </select>
        <button class="btn-primary" id="recipeSubmitBtn" onclick="saveRecipe()">追加する</button>
        <button class="btn-danger" id="recipeCancelBtn" style="display:none;margin-top:8px;" onclick="cancelEdit()">編集をキャンセル</button>
      </div>
      <div class="card"><div class="card-title">登録済みレシピ</div><div id="recipeList"></div></div>
    </div>
  </div>

  <!-- ボトムタブ -->
  <nav class="tab-bar">
    <div class="tab-item active" onclick="switchTab('home')"><div class="tab-icon">🏠</div><span>ホーム</span></div>
    <div class="tab-item" onclick="switchTab('recipe')"><div class="tab-icon">🍳</div><span>レシピ</span></div>
    <div class="tab-item" onclick="switchTab('inventory')"><div class="tab-icon">❄️</div><span>冷蔵庫</span></div>
  </nav>

  <script>
    // ==========================================
    // ⚙️ GASのURL設定（ダブルクォーテーション " を消さないでください！）
    // ==========================================
    const GAS_URL = "https://script.google.com/macros/s/AKfycbxaeB6OHu8Y-l95ZdG2dxbyq_KPTu0zsGfr6VeAGwVlrcSOpVk75lehGzNlPIWQsyya/exec";
    
    let GEMINI_API_KEY = "";
    let state = { recipes: [], inventory: [], history: [], currentMenu: [] };
    let editingRecipeName = null;

    function jsonp(action, payload = null) {
      return new Promise((resolve, reject) => {
        const cb = 'jsonp_cb_' + Math.round(100000 * Math.random());
        const tId = setTimeout(() => { delete window[cb]; reject(new Error("⚠️ GASから応答がありません。")); }, 10000);
        window[cb] = function(data) { clearTimeout(tId); delete window[cb]; document.body.removeChild(script); resolve(data); };
        let url = `${GAS_URL}?action=${action}&callback=${cb}&t=${Date.now()}`;
        if (payload) url += `&payload=${encodeURIComponent(JSON.stringify(payload))}`;
        const script = document.createElement('script'); script.src = url; 
        script.onerror = () => { clearTimeout(tId); reject(new Error("⚠️ 通信エラーが発生しました。")); };
        document.body.appendChild(script);
      });
    }

    window.onload = async () => {
      try {
        const res = await jsonp('getData');
        if(res.status === 'success') {
          state.recipes = res.recipes || []; state.inventory = res.inventory || []; state.history = res.history || [];
          GEMINI_API_KEY = res.apiKey || "";
          document.getElementById("loading").style.display = "none"; document.getElementById("app").style.display = "block";
          renderAll();
        } else { throw new Error(res.message); }
      } catch (e) { 
        document.getElementById("loadingIcon").innerText = "🚨";
        document.getElementById("loadingText").innerHTML = `<span style="color:var(--danger); font-weight:bold;">エラー</span>`;
        document.getElementById("errorArea").innerHTML = `<div style="font-size:14px;background:#ffebee;color:var(--danger);padding:16px;border-radius:8px;">${e.message}</div><button class="btn-primary" style="margin-top:20px;" onclick="location.reload()">再読込</button>`;
      }
    };

    async function saveData() { jsonp('saveData', { recipes: state.recipes, inventory: state.inventory, history: state.history }); }

    function switchTab(tId) {
      document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
      document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
      document.getElementById(`view-${tId}`).classList.add('active');
      event.currentTarget.classList.add('active');
      renderAll();
    }

    function renderAll() { renderMenu(); renderInventory(); renderChips(); renderRecipeList(); }

    function getCurrentSeason() { const m = new Date().getMonth()+1; return (m>=3&&m<=5)?'春':(m>=6&&m<=8)?'夏':(m>=9&&m<=11)?'秋':'冬'; }

    function generateMenu() {
      const days = parseInt(document.getElementById('planDays').value);
      const current = getCurrentSeason();
      let avail = state.recipes.filter(r => r.season.includes('通年') || r.season.includes(current));
      let pool = avail.filter(r => !state.history.includes(r.name));
      if (pool.length < days) pool = avail;
      pool = pool.sort(() => 0.5 - Math.random());
      
      let sel = []; let hDiff = 0;
      for (let r of pool) {
        if (sel.length === days) break;
        if (parseInt(r.difficulty) >= 4) { if (hDiff === 0) { sel.push(r.name); hDiff++; } } else { sel.push(r.name); }
      }
      state.currentMenu = sel; state.history = [...sel]; saveData(); renderMenu();
    }

    function renderMenu() {
      const c = document.getElementById("menuContainer"); c.innerHTML = "";
      if (state.currentMenu.length === 0) { document.getElementById("copyCard").style.display = "none"; return; }
      document.getElementById("copyCard").style.display = "block";
      const allNames = state.recipes.map(r => r.name);
      state.currentMenu.forEach((mName, i) => {
        const r = state.recipes.find(x => x.name === mName); if(!r) return;
        const ings = r.ingredients.split(',').map(x=>x.trim()).filter(x=>x);
        let iHtml = ""; ings.forEach(ing => { iHtml += state.inventory.includes(ing) ? `<span class="strikethrough">~${ing}~</span>, ` : `<span>${ing}</span>, `; });
        let sHtml = `<select onchange="changeMenu(${i}, this.value)">`;
        allNames.forEach(n => { sHtml += `<option value="${n}" ${n === mName ? 'selected' : ''}>${n}</option>`; }); sHtml += `</select>`;
        c.innerHTML += `<div class="card"><div style="font-size:14px;color:var(--primary-color);margin-bottom:4px;">Day ${i+1}</div>${sHtml}<div style="font-size:14px;color:var(--text-sub);margin-bottom:8px;">難易度: ${r.difficulty}</div><div style="font-size:15px;">🥕 ${iHtml.slice(0,-2)}</div></div>`;
      });
    }

    function changeMenu(i, n) { state.currentMenu[i] = n; state.history = [...state.currentMenu]; saveData(); renderMenu(); }

    function copyToClipboard() {
      let t = "🍳 今週の献立\n\n";
      state.currentMenu.forEach((m, i) => {
        const r = state.recipes.find(x => x.name === m); t += `【Day ${i+1}】${m}\n`;
        if(r) { const b = r.ingredients.split(',').map(x=>x.trim()).filter(ing => ing && !state.inventory.includes(ing)); t += `🛒 買うもの: ${b.length>0 ? b.join(', ') : 'なし'}\n\n`; }
      });
      navigator.clipboard ? navigator.clipboard.writeText(t).then(()=>alert("LINE用にコピーしました！")) : alert("コピー不可");
    }

    function addInventoryManual() { const v = document.getElementById("invInput").value.trim(); if(v && !state.inventory.includes(v)) { state.inventory.push(v); document.getElementById("invInput").value = ""; saveData(); renderAll(); } }
    function removeInventory(item) { state.inventory = state.inventory.filter(i => i !== item); saveData(); renderAll(); }
    
    function renderInventory() {
      const list = document.getElementById("inventoryList"); list.innerHTML = "";
      if (state.inventory.length === 0) list.innerHTML = "<span style='color:var(--text-sub); font-size:14px;'>冷蔵庫は空です</span>";
      state.inventory.forEach(i => { list.innerHTML += `<div class="list-item"><span>${i}</span><button class="btn-danger" style="width:auto;padding:6px 16px;font-size:14px;" onclick="removeInventory('${i}')">消費</button></div>`; });
    }

    function renderChips() {
      const c = document.getElementById("chipContainer"); c.innerHTML = ""; let all = [];
      state.recipes.forEach(r => r.ingredients.split(',').forEach(i => { const n = i.trim(); if(n && !all.includes(n)) all.push(n); }));
      const ms = all.filter(ing => !state.inventory.includes(ing));
      if(ms.length === 0) { c.innerHTML = "<span style='color:var(--text-sub);font-size:14px;'>すべての食材が揃っています</span>"; return; }
      ms.forEach(i => c.innerHTML += `<div class="chip" onclick="addFromChip('${i}')">＋ ${i}</div>`);
    }
    function addFromChip(item) { if(!state.inventory.includes(item)) { state.inventory.push(item); saveData(); renderAll(); } }

    function resizeImage(file, maxW, maxH) {
      return new Promise((res) => {
        const r = new FileReader(); r.onload = (e) => { const img = new Image(); img.onload = () => {
          const c = document.createElement('canvas'); let w = img.width; let h = img.height;
          if (w > h) { if (w > maxW) { h *= maxW / w; w = maxW; } } else { if (h > maxH) { w *= maxH / h; h = maxH; } }
          c.width = w; c.height = h; c.getContext('2d').drawImage(img, 0, 0, w, h); res(c.toDataURL('image/jpeg', 0.7));
        }; img.src = e.target.result; }; r.readAsDataURL(file);
      });
    }

    let b64Img = "";
    async function previewImage(event) {
      const f = event.target.files[0]; if(!f) return;
      document.getElementById("aiStatus").innerText = "🔄 画像を最適化中...";
      const compressed = await resizeImage(f, 800, 800);
      document.getElementById("imagePreview").src = compressed; document.getElementById("imagePreview").style.display = "block";
      document.getElementById("aiBtn").style.display = "block";
      b64Img = compressed.split(',')[1];
      document.getElementById("aiStatus").innerText = "✅ 解析の準備ができました";
    }

    async function analyzeImage() {
      if(!GEMINI_API_KEY) { alert("APIキーが未設定です。"); return; }
      const status = document.getElementById("aiStatus"); status.innerText = "🔄 AIが画像を解析中...";
      const all = [...new Set(state.recipes.flatMap(r => r.ingredients.split(',').map(i=>i.trim()).filter(i=>i)))];
      const pText = `画像に写っている食材をカンマ区切りで出力。飲み物や調味料は絶対除外。以下の【リスト】にある場合は表記を合わせる。出力は食材名のみ。\n【リスト】 ${all.join(', ')}`;
      const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`;
      
      try {
        const res = await fetch(url, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ contents: [{ parts: [ { text: pText }, { inline_data: { mime_type: "image/jpeg", data: b64Img } } ] }] }) });
        const json = await res.json();
        if (!res.ok) throw new Error(json.error ? json.error.message : "APIエラー");
        if(json.candidates && json.candidates.length > 0) {
          if(!json.candidates[0].content) { status.innerHTML = `<span style="color:var(--danger);">⚠️ AIブロック</span>`; return; }
          const detected = json.candidates[0].content.parts[0].text.split(',').map(i=>i.trim()).filter(i=>i);
          let added = 0; detected.forEach(item => { if(!state.inventory.includes(item)) { state.inventory.push(item); added++; } });
          if(added > 0) saveData(); renderAll();
          status.innerHTML = `<span style="color:#34c759;font-weight:bold;">✨ ${added}個追加！(${detected.join(', ')})</span>`;
        } else { status.innerText = "⚠️ 認識不可"; }
      } catch (e) { status.innerHTML = `<span style="color:var(--danger);">⚠️ ${e.message}</span>`; }
    }

    function editRecipe(name) {
      const r = state.recipes.find(x => x.name === name); if(!r) return;
      editingRecipeName = name; document.getElementById("rName").value = r.name; document.getElementById("rDiff").value = r.difficulty;
      document.getElementById("diffLabel").innerText = r.difficulty; document.getElementById("rIngs").value = r.ingredients;
      const ss = r.season.split(',').map(s=>s.trim()); Array.from(document.getElementById("rSeason").options).forEach(opt => { opt.selected = ss.includes(opt.value); });
      document.getElementById("recipeFormTitle").innerHTML = `✏️ 「${name}」を編集中`;
      const btn = document.getElementById("recipeSubmitBtn"); btn.innerText = "上書き保存"; btn.style.backgroundColor = "#ff9500";
      document.getElementById("recipeCancelBtn").style.display = "block"; document.getElementById("recipeFormCard").style.border = "2px solid #ff9500";
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function cancelEdit() {
      editingRecipeName = null; document.getElementById("rName").value = ""; document.getElementById("rIngs").value = "";
      document.getElementById("rDiff").value = "3"; document.getElementById("diffLabel").innerText = "3";
      document.getElementById("recipeFormTitle").innerHTML = "📝 新規レシピ登録";
      const btn = document.getElementById("recipeSubmitBtn"); btn.innerText = "追加する"; btn.style.backgroundColor = "var(--primary-color)";
      document.getElementById("recipeCancelBtn").style.display = "none"; document.getElementById("recipeFormCard").style.border = "2px solid transparent";
    }

    function saveRecipe() {
      const n = document.getElementById("rName").value.trim(); const d = document.getElementById("rDiff").value; const i = document.getElementById("rIngs").value.trim();
      const s = Array.from(document.getElementById("rSeason").selectedOptions).map(opt => opt.value).join(', ');
      if (n && i) {
        if(editingRecipeName) {
           if (n !== editingRecipeName && state.recipes.some(r => r.name === n)) { alert("既存レシピです"); return; }
           state.recipes[state.recipes.findIndex(r => r.name === editingRecipeName)] = { name: n, difficulty: d, ingredients: i, season: s };
           alert("更新しました！"); cancelEdit();
        } else {
           if(state.recipes.some(r => r.name === n)) { alert("登録済みです"); return; }
           state.recipes.push({ name: n, difficulty: d, ingredients: i, season: s });
           alert("追加しました！"); cancelEdit();
        }
        saveData(); renderAll();
      } else { alert("未入力があります。"); }
    }

    function removeRecipe(name) { if(confirm(`「${name}」を削除しますか？`)) { state.recipes = state.recipes.filter(r => r.name !== name); saveData(); renderAll(); } }

    function renderRecipeList() {
      const list = document.getElementById("recipeList"); list.innerHTML = "";
      state.recipes.forEach(r => {
        list.innerHTML += `<div class="list-item" style="display:block;">
            <div style="display:flex;justify-content:space-between;align-items:center;"><span style="font-weight:600;">${r.name}</span>
            <div><button class="btn-secondary" style="width:auto;padding:6px 12px;font-size:14px;margin-right:4px;" onclick="editRecipe('${r.name}')">✏️ 編集</button><button class="btn-danger" style="width:auto;padding:6px 12px;font-size:14px;" onclick="removeRecipe('${r.name}')">🗑 削除</button></div></div>
            <div style="font-size:13px;color:var(--text-sub);margin-top:4px;">難易度: ${r.difficulty} | 季節: ${r.season}</div>
            <div style="font-size:14px;margin-top:4px;">🥕 ${r.ingredients}</div></div>`;
      });
    }
  </script>
</body>
</html>
